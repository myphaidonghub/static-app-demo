<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phaidon TA Reports</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #ffffff;
    background: #0a0a14;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 60% at 75% 55%, rgba(91, 33, 182, 0.45) 0%, rgba(45, 27, 94, 0.15) 40%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 20% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 60%),
      #0a0a14;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* subtle grid texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(139, 92, 246, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139, 92, 246, 0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* ============ HEADER ============ */
  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 40px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo img {
    height: 44px;
    width: auto;
    display: block;
  }

  .logo-text {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #ffffff;
  }

  .logo-text .accent {
    color: #8b5cf6;
  }

  .header-meta {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.02em;
  }

  /* ============ MAIN ============ */
  main {
    flex: 1;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 32px 60px;
    text-align: center;
  }

  .hero h1 {
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin-bottom: 18px;
    color: #ffffff;
  }

  .hero p.subtitle {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.6);
    max-width: 560px;
    margin: 0 auto 56px;
    line-height: 1.55;
  }

  /* ============ REPORT CARDS ============ */
  .reports {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    width: 100%;
    max-width: 560px;
  }

  .report-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 26px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .report-card:hover {
    background: rgba(139, 92, 246, 0.08);
    border-color: rgba(139, 92, 246, 0.4);
    transform: translateY(-1px);
  }

  .report-left {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .report-icon {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    background: rgba(139, 92, 246, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a78bfa;
    flex-shrink: 0;
  }

  .report-icon svg {
    width: 22px;
    height: 22px;
  }

  .report-text {
    text-align: left;
  }

  .report-title {
    font-size: 16px;
    font-weight: 500;
    color: #ffffff;
    margin-bottom: 3px;
  }

  .report-desc {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.5);
    line-height: 1.4;
  }

  .report-arrow {
    color: rgba(255, 255, 255, 0.4);
    transition: transform 0.2s ease, color 0.2s ease;
    flex-shrink: 0;
  }

  .report-card:hover .report-arrow {
    color: #a78bfa;
    transform: translateX(4px);
  }

  /* ============ FOOTER ============ */
  .footnote {
    margin-top: 56px;
    padding-top: 24px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.3);
    letter-spacing: 0.02em;
  }

  footer {
    position: relative;
    z-index: 1;
    padding: 20px 40px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    text-align: center;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.35);
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 640px) {
    header { padding: 16px 20px; }
    main { padding: 48px 20px 40px; }
    .logo img { height: 36px; }
    .logo-text { font-size: 16px; }
    .header-meta { display: none; }
    .report-card { padding: 18px 20px; }
    .report-left { gap: 14px; }
    .report-icon { width: 38px; height: 38px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="phaidon-logo.png" alt="Phaidon International">
      <span class="logo-text size=6">TA Reports<span class="accent">.</span></span>
    </div>
    <div class="header-meta">Talent Acquisition</div>
  </header>

  <main>
    <div class="hero">
      <h1>Phaidon International TA reports hub.</h1>
	  
      <p class="subtitle">Select a report below to view dashboards and analytics for Phaidon's Talent Acquisition team.</p>
    </div>

    <div class="reports">
      <a class="report-card" href="GTADashboard.html" target="_blank" rel="noopener noreferrer">
        <div class="report-left">
          <div class="report-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
          <div class="report-text">
            <div class="report-title">Global TA Dashboard</div>
            <div class="report-desc">Worldwide hiring metrics &amp; KPIs</div>
          </div>
        </div>
        <svg class="report-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>

      <!-- ============================================================
           To add more reports, copy the <a class="report-card"> block
           above and change the href, title, description, and icon.
           Icons can be swapped from https://tabler.io/icons (paste SVG).
           ============================================================ -->
    </div>

    <div class="footnote">More reports coming soon</div>
  </main>

  <footer>
    &copy; Phaidon International &middot; Internal use only
  </footer>

</body>
</html>
